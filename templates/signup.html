<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SentiSound</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #1e3a8a; min-height: 100vh; display:flex; align-items:center; justify-content:center; color:#ffffff; }
        .card { background:white; border-radius:16px; padding:30px; width:100%; max-width:480px; box-shadow:0 20px 40px rgba(0,0,0,0.1); }
        .title { text-align:center; margin-bottom:20px; }
        .title h1 { margin:0; font-size:1.8rem; }
        .input { width:100%; padding:12px 14px; border:1px solid #e5e7eb; border-radius:10px; margin-top:8px; }
        .label { font-size:0.95rem; color:#374151; font-weight:600; }
        .row { margin-bottom:16px; }
        .btn { width:100%; background: #1e3a8a; color: white; border: 2px solid #1e3a8a; padding: 12px 16px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .error { background:#fde8e8; color:#b91c1c; padding:10px 12px; border-radius:10px; margin-bottom:12px; }
        .hint { color:#6b7280; font-size:0.9rem; }
        .link { color:#eef2ff; text-decoration:none; font-weight:600; }
    </style>
    <script>
      function googleSignup(){ window.location.href = '/login/google'; }
    </script>
</head>
<body>
  <div class="card">
    <div class="title">
      <h1><i class="fas fa-microphone-alt"></i> Create your account</h1>
    </div>
    {% if error %}
      <div class="error"><i class="fas fa-exclamation-triangle"></i> {{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="row">
        <label class="label">Name</label>
        <input class="input" type="text" name="name" value="{{ name or '' }}" placeholder="Your name">
      </div>
      <div class="row">
        <label class="label">Email</label>
        <input class="input" type="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required>
      </div>
      <div class="row">
        <label class="label">Password</label>
        <input class="input" type="password" name="password" placeholder="At least 8 chars, upper, lower, digit" required>
        <div class="hint">Password must be 8+ chars and include uppercase, lowercase, and a number.</div>
      </div>
      <div class="row">
        <label class="label">Confirm Password</label>
        <input class="input" type="password" name="confirm_password" placeholder="Re-enter your password" required>
      </div>
      <div class="row">
        <button class="btn" type="submit">Create Account</button>
      </div>
    </form>
    <div class="row">
      <button class="btn" style="background:white;color:#374151;border:1px solid #e5e7eb;" onclick="googleSignup()"><i class="fab fa-google"></i> Sign up with Google</button>
    </div>
    <div style="text-align:center; margin-top:8px; color:#6b7280;">
      Already have an account? <a href="/login" class="link">Sign in</a>
    </div>
  </div>
</body>
</html>
